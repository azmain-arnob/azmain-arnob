<g mask="url(#soften)">
  <g class="roll">
    <text class="t" x="168" y="34">Final-year Computer Science &amp; Engineering student at North South University, graduating October 2026  <tspan fill="#3E8CFF">&#9670;</tspan>  Python on the server side: Flask, Django, MongoDB, REST APIs, schema design that survives real query patterns  <tspan fill="#3E8CFF">&#9670;</tspan>  Real-time desktop systems with Electron, Socket.IO and peer-to-peer WebRTC  <tspan fill="#3E8CFF">&#9670;</tspan>  Applied AI: retrieval-augmented assistants over local documents, medical imaging, instance-aware object removal  <tspan fill="#3E8CFF">&#9670;</tspan>  Currently finishing LabDesk, my senior design capstone, and adding agentic AI to it  <tspan fill="#3E8CFF">&#9670;</tspan>  Bengali, English, Hindi  <tspan fill="#3E8CFF">&#9670;</tspan>  Open to entry-level software engineering roles in Dhaka  <tspan fill="#3E8CFF">&#9670;</tspan>  </text>
    <text class="t" x="5571" y="34">Final-year Computer Science &amp; Engineering student at North South University, graduating October 2026  <tspan fill="#3E8CFF">&#9670;</tspan>  Python on the server side: Flask, Django, MongoDB, REST APIs, schema design that survives real query patterns  <tspan fill="#3E8CFF">&#9670;</tspan>  Real-time desktop systems with Electron, Socket.IO and peer-to-peer WebRTC  <tspan fill="#3E8CFF">&#9670;</tspan>  Applied AI: retrieval-augmented assistants over local documents, medical imaging, instance-aware object removal  <tspan fill="#3E8CFF">&#9670;</tspan>  Currently finishing LabDesk, my senior design capstone, and adding agentic AI to it  <tspan fill="#3E8CFF">&#9670;</tspan>  Bengali, English, Hindi  <tspan fill="#3E8CFF">&#9670;</tspan>  Open to entry-level software engineering roles in Dhaka  <tspan fill="#3E8CFF">&#9670;</tspan>  </text>
